name: Flatpak — Build & Publish to GitHub Pages

on:
  # Auto-trigger when a new release is published
  release:
    types: [published]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write   # to upload release assets
  pages: write      # to deploy to GitHub Pages
  id-token: write   # for Pages OIDC token

jobs:
  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    # Run inside the official flatpak-builder Docker image for gnome-47 SDK
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Determine which release tag we're building ────────────────────────
      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # ── Download the .deb from the GitHub release and extract the binary ──
      - name: Download release .deb and extract binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          echo "Building Flatpak for release: $TAG"

          # Download the .deb asset
          mkdir -p /tmp/release
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir /tmp/release

          DEB=$(ls /tmp/release/*.deb | head -1)
          echo "Found deb: $DEB"

          # Extract the binary from the .deb
          dpkg-deb -x "$DEB" /tmp/extracted
          cp /tmp/extracted/usr/bin/recopied flatpak/recopied
          chmod +x flatpak/recopied

          echo "Binary ready: $(file flatpak/recopied)"

      # ── Build the Flatpak bundle ──────────────────────────────────────────
      - name: Build Flatpak
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: recopied.flatpak
          manifest-path: flatpak/com.recopied.app.yml
          # Cache the SDK and built modules between runs
          cache: true
          cache-key: flatpak-v1-gnome47-${{ hashFiles('flatpak/com.recopied.app.yml') }}

      # ── Upload the bundle to the GitHub release ───────────────────────────
      - name: Upload Flatpak bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          gh release upload "$TAG" recopied.flatpak \
            --repo "${{ github.repository }}" \
            --clobber

      # ── Persist the bundle for the next job ──────────────────────────────
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: recopied.flatpak
          retention-days: 1

  publish-repo:
    name: Publish static Flatpak repo to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-flatpak

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak

      # ── Download the bundle built in the previous job ────────────────────
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      # ── Check out or create the flatpak-repo branch ──────────────────────
      - name: Restore or initialize flatpak-repo
        run: |
          # Try to restore an existing static repo from the flatpak-repo branch
          if git ls-remote --exit-code origin flatpak-repo; then
            git fetch origin flatpak-repo
            git checkout -b flatpak-repo origin/flatpak-repo
            mkdir -p repo
            # The tracked content is an ostree-style static repo inside ./repo/
          else
            echo "No flatpak-repo branch yet — initialising a fresh repo"
            mkdir -p repo
          fi
          git checkout main  # switch back so we can use the repo/ dir

      # ── Export the new bundle into the ostree repo ───────────────────────
      - name: Export bundle into repo
        run: |
          # flatpak build-bundle creates the bundle; flatpak build-import-bundle imports it
          flatpak build-import-bundle repo/ recopied.flatpak

      # ── Regenerate the static repo metadata ─────────────────────────────
      - name: Update repo metadata
        run: |
          flatpak build-update-repo \
            --generate-static-deltas \
            --default-branch=stable \
            repo/

      # ── Add a minimal index.html so the page looks good in a browser ─────
      - name: Add repo index page
        run: |
          cat > repo/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>Recopied Flatpak Repository</title>
          <style>body{font-family:sans-serif;max-width:700px;margin:3rem auto;padding:0 1rem}code{background:#f4f4f4;padding:.2em .4em;border-radius:4px}</style>
          </head>
          <body>
          <h1>📋 Recopied — Flatpak Repository</h1>
          <p>This is the official self-hosted Flatpak repository for <strong>Recopied</strong>,
             a Linux clipboard manager with a Win+V shortcut.</p>

          <h2>Add this repository</h2>
          <pre><code>flatpak remote-add --if-not-exists recopied \
            https://mrbeandev.github.io/Recopied/</code></pre>

          <h2>Install Recopied</h2>
          <pre><code>flatpak install recopied com.recopied.app</code></pre>

          <h2>Or install directly from the bundle file</h2>
          <p>Download <code>recopied.flatpak</code> from the
             <a href="https://github.com/mrbeandev/Recopied/releases">GitHub Releases</a> page, then:</p>
          <pre><code>flatpak install recopied.flatpak</code></pre>

          <hr>
          <p><a href="https://github.com/mrbeandev/Recopied">GitHub</a> ·
             <a href="https://github.com/mrbeandev/Recopied/releases">Releases</a></p>
          </body></html>
          HTML

      # ── Deploy the static repo to GitHub Pages ───────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
