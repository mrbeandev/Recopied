name: Flatpak — Build & Publish to GitHub Pages

on:
  # Auto-trigger when a new release is published
  release:
    types: [published]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write   # to upload release assets
  pages: write      # to deploy to GitHub Pages
  id-token: write   # for Pages OIDC token

jobs:
  # ── Job 1: Download the .deb on ubuntu-latest (gh CLI available here) ────
  prepare:
    name: Extract binary from release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release .deb and extract binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          echo "Preparing binary for release: $TAG"

          mkdir -p /tmp/release
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir /tmp/release

          DEB=$(ls /tmp/release/*.deb | head -1)
          echo "Found deb: $DEB"

          dpkg-deb -x "$DEB" /tmp/extracted
          cp /tmp/extracted/usr/bin/recopied flatpak/recopied
          chmod +x flatpak/recopied
          echo "Binary ready: $(file flatpak/recopied)"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: recopied-binary
          path: flatpak/recopied
          retention-days: 1

  # ── Job 2: Build the Flatpak inside the official GNOME SDK container ─────
  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download recopied binary
        uses: actions/download-artifact@v4
        with:
          name: recopied-binary
          path: flatpak/

      - name: Make binary executable
        run: chmod +x flatpak/recopied

      - name: Build Flatpak
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: recopied.flatpak
          manifest-path: flatpak/com.recopied.app.yml
          cache: true
          cache-key: flatpak-v1-gnome47-${{ hashFiles('flatpak/com.recopied.app.yml') }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: recopied.flatpak
          retention-days: 1

  # ── Job 3: Upload bundle to release + deploy ostree repo to Pages ─────────
  publish:
    name: Upload to release & publish Pages repo
    runs-on: ubuntu-latest
    needs: [prepare, build-flatpak]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Install flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak ostree

      - name: Upload Flatpak bundle to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release upload "$TAG" recopied.flatpak \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Export bundle into static ostree repo
        run: |
          mkdir -p repo
          ostree init --mode=archive-z2 --repo=repo/
          flatpak build-import-bundle repo/ recopied.flatpak
          flatpak build-update-repo \
            --generate-static-deltas \
            --default-branch=stable \
            repo/

      - name: Add .flatpakrepo file and index page
        run: |
          cat > repo/recopied.flatpakrepo << 'REPO'
          [Flatpak Repo]
          Title=Recopied
          Url=https://mrbeandev.github.io/Recopied/
          Homepage=https://github.com/mrbeandev/Recopied
          Comment=Clipboard manager for Linux with Win+V shortcut
          Description=Self-hosted Flatpak repository for Recopied
          Icon=https://raw.githubusercontent.com/mrbeandev/Recopied/main/src-tauri/icons/128x128.png
          GPGVerify=false
          DefaultBranch=stable
          REPO

          cp flatpak/pages-index.html repo/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
